name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: gateway,   path: gateway/gateway }
          - { name: cart,      path: cart }
          - { name: delivery,  path: delivery/delivery }
          - { name: inventory, path: inventory/inventory }
          - { name: order,     path: order/order }
          - { name: payment,   path: payment/payment }
          - { name: products,  path: products/products }
          - { name: users,     path: users }

    # The @SpringBootTest context tests boot the real app: Flyway migrates and
    # Hibernate validates the schema against a real PostgreSQL.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ci_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: adminpassword

    defaults:
      run:
        working-directory: ${{ matrix.service.path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service.path }}/pom.xml

      - name: Maven test
        run: |
          if [ "${{ matrix.service.name }}" = "gateway" ]; then
            # gateway uses R2DBC at runtime and a dedicated JDBC URL for Flyway
            export SPRING_R2DBC_URL=r2dbc:postgresql://localhost:5432/ci_db
            export SPRING_FLYWAY_URL=jdbc:postgresql://localhost:5432/ci_db
            export DB_USERNAME=admin DB_PASSWORD=adminpassword
          fi
          mvn -B -ntp verify
