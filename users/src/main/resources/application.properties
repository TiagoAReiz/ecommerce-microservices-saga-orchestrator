spring.application.name=users

# DataSource: credentials come from the environment, with no defaults (docker-compose / CI provide them).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/users_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT (HS256). The secret is REQUIRED and intentionally has no default: it must be the same value the
# gateway uses to validate tokens (>= 32 bytes). docker-compose provides a dev-only value; see .env.example.
app.jwt.secret=${JWT_SECRET}
# Access tokens are short-lived (default 15 min) because the gateway validates them statelessly: a
# logout/revocation takes effect for access tokens only when they expire. Refresh tokens (default 7 days)
# are opaque, stored hashed in refresh_tokens, rotated on every use and revocable.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Admin bootstrap: comma-separated e-mails that receive the ADMIN role on registration/login/refresh.
# Empty by default (no admins). See README "Administradores".
app.security.admin-emails=${ADMIN_EMAILS:}
